<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250" role="img" aria-label="Tako AGY Bar preview in Antigravity CLI">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#131922" />
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-6%" width="108%" height="114%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="860" height="250" rx="14" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="828" height="218" rx="12" fill="#0f141b" stroke="#26303d" stroke-width="1.2" filter="url(#cardShadow)" />

  <!-- Terminal Header -->
  <rect x="16" y="16" width="828" height="36" rx="12" fill="#161d27" />
  <rect x="16" y="40" width="828" height="12" fill="#161d27" />
  <line x1="16" y1="52" x2="844" y2="52" stroke="#232d3a" stroke-width="1" />
  <circle cx="38" cy="34" r="5.5" fill="#ff5f56" />
  <circle cx="56" cy="34" r="5.5" fill="#ffbd2e" />
  <circle cx="74" cy="34" r="5.5" fill="#27c93f" />
  <text x="430" y="38" text-anchor="middle" fill="#8b949e" font-family="'Cascadia Mono', 'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="600">agy — Antigravity CLI · Tako AGY Bar</text>

  <!-- Simulated TUI Prompt Box -->
  <rect x="34" y="68" width="792" height="44" rx="7" fill="#121821" stroke="#283342" stroke-width="1" />
  <text x="48" y="95" fill="#57caff" font-family="'Cascadia Mono', 'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="700">&gt;</text>
  <text x="66" y="95" fill="#7d8590" font-family="'Cascadia Mono', 'JetBrains Mono', Consolas, monospace" font-size="13.5">Ask anything, / for commands, @ for files...</text>

  <!-- Built-in Status Line (stack_with_default: true) -->
  <text x="822" y="136" text-anchor="end" fill="#8b949e" font-family="'Cascadia Mono', 'JetBrains Mono', Consolas, monospace" font-size="13">accept-edits · Gemini 4 Hydrogen · xhigh</text>

  <!-- Tako AGY Bar Line 1 (with 1 blank-line spacer above) -->
  <text x="822" y="176" text-anchor="end" font-family="'Cascadia Mono', 'JetBrains Mono', Consolas, monospace" font-size="13.5" xml:space="preserve"><tspan fill="#ffffff">Cached </tspan><tspan fill="#71da64" font-weight="700">98.7%</tspan><tspan fill="#6e7b8f"> | </tspan><tspan fill="#ffffff">Context </tspan><tspan fill="#ff8d41" font-weight="700">38.1%</tspan><tspan fill="#ff8d41"> ███</tspan><tspan fill="#8b949e">░░░░░░░</tspan><tspan fill="#ff8d41"> 399.2</tspan><tspan fill="#d0d7de">/512.0k</tspan></text>

  <!-- Tako AGY Bar Line 2 (with 1 blank-line spacer between lines) -->
  <text x="822" y="212" text-anchor="end" font-family="'Cascadia Mono', 'JetBrains Mono', Consolas, monospace" font-size="13.5" xml:space="preserve"><tspan fill="#ffffff">Five Hours </tspan><tspan fill="#d5d639" font-weight="700">63%</tspan><tspan fill="#d5d639"> ██████</tspan><tspan fill="#8b949e">░░░░</tspan><tspan fill="#57caff" font-weight="700"> 4h37m</tspan><tspan fill="#6e7b8f"> | </tspan><tspan fill="#ffffff">Weekly </tspan><tspan fill="#97d954" font-weight="700">82%</tspan><tspan fill="#97d954"> ████████</tspan><tspan fill="#8b949e">░░</tspan><tspan fill="#57caff" font-weight="700"> 6d9h</tspan></text>
</svg>
